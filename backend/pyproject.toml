[project]
name = "vvaharness-console-backend"
version = "0.1.0"
description = "Web console around the vvaharness agentic SAST CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "vvaharness",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() in defaults is idiomatic FastAPI

[tool.pyright]
venvPath = ".."
venv = ".venv"
typeCheckingMode = "basic"
